# PostgreSQL + NestJS API
# Run from this folder: docker compose up --build
# DB only: docker compose up db
# Optional: export JWT_SECRET=... or add JWT_SECRET to .env beside this file.

services:
  db:
    image: postgres:15-alpine
    container_name: copd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: copd_care
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d copd_care']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.1}
        GIT_SHA: ${GIT_SHA:-local}
    container_name: copd_api
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: user
      DB_PASSWORD: password
      DB_NAME: copd_care
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      # 호스트의 backend/.env 에서 읽음 (compose와 같은 디렉터리의 .env)
      AIR_KOREA_SERVICE_KEY: ${AIR_KOREA_SERVICE_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
